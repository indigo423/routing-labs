---
services:

  mimir:
    image: grafana/mimir:latest
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 256m
    command: ["-config.file=/etc/mimir-config.yaml"]
    volumes:
      - ./mimir/mimir-config.yaml:/etc/mimir-config.yaml
      - data-mimir:/data/mimir
    ports:
      - "9009/tcp"

volumes:
  data-mimir: {}